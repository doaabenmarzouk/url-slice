apiVersion: apps/v1
kind: Deployment

metadata:
  name: url-slice-deployment
  namespace: url-slice
  labels:
    app.kubernetes.io/name: url-slice

spec:
  replicas: 1                      # SQLite : un seul pod

  strategy:
    type: Recreate                 # évite 2 pods sur la même base pendant la mise à jour

  selector:
    matchLabels:
      app: url-slice

  template:
    metadata:
      labels:
        app: url-slice

    spec:
      securityContext:
        fsGroup: 1000              # droits d'écriture sur /data

      containers:
        - name: url-slice-container
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: DATABASE_URL
              value: "sqlite:////data/urls.db"

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: data
          emptyDir: {}