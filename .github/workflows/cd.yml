# https://github.com/docker/build-push-action
name: CD - Publish image

on:
  workflow_run:
    workflows: ["URL Shortener - CI Pipeline"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/url-slice:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/url-slice:${{ github.sha }}

  deploy:
    name: Deploy to k3s
    needs: publish
    runs-on: [self-hosted, linux, k3s]
    timeout-minutes: 20
    env:
      KUBECONFIG: /home/doua/.kube/config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ secrets.DOCKERHUB_USERNAME }}/url-slice:${{ github.run_number }}|" k8s/deployment.yml

      - name: Deploy
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/url-slice -n url-slice --timeout=300s

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/url-slice -n url-slice