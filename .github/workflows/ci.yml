name: URL Shortener - CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: PYTHON TESTS
  # ==========================================
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --tb=short

  # ==========================================
  # JOB 2: SAST - BANDIT SECURITY SCAN
  # ==========================================
  
  #I generate a security report to keep
  # a record of all detected vulnerabilities. Then, I use a security gate to enforce a security policy and fail the pipeline if high-severity issues are found.

  sast:
    name: SAST - Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Generate Bandit security report
        run: |
          bandit -r app/ -f json -o bandit-report.json --exit-zero

      - name: Bandit security gate
        run: |
          bandit -r app/ -lll

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: warn

  build:
      name: Docker Build
      runs-on: ubuntu-latest
      timeout-minutes: 20
      needs: [test, sast]
      steps: 
          -  name : Checkout code
             uses: actions/checkout@v4
          -  name: Set up Docker Buildx
             uses: docker/setup-buildx-action@v3
          - name : Build image
            uses:  docker/build-push-action@v6
            with: 
               context: .
               push: false
               load: true
               tags: url-slice:${{ github.sha }}
               cache-from: type=gha
               cache-to: type=gha,mode=max

  trivy_scan:

 