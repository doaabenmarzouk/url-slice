
name: URL Shortener - CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
    paths-ignore:
      - "README.md"
      - "docs/**"

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: url-slice

jobs:

  # ==========================================
  # JOB 1: CI - TESTS AND CODE SECURITY
  # ==========================================

  ci:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      # 4. Verify Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall -q app

      # 5. SAST - Bandit
      - name: Bandit security scan
        run: |
          bandit -r app -ll -f txt

      # 6. Automated tests
      - name: Run Pytest
        run: |
          pytest -v --tb=short


  # ==========================================
  # JOB 2: DOCKER BUILD AND SECURITY
  # ==========================================

  docker-security:
    name: Docker Build and Trivy Security
    runs-on: ubuntu-latest
    needs: ci

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      # 3. Generate Trivy security report
      - name: Generate Trivy security report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: url-slice:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          vuln-type: os,library

      # 4. Upload Trivy report
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30

      # 5. Trivy security gate
      - name: Trivy security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: url-slice:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
